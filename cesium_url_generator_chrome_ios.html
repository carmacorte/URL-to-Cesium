<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cesium Yield URL Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fbfe;
      padding: 20px;
      color: #1f2937;
    }
    h2 {
      font-size: 1.4em;
      margin-bottom: 10px;
      color: #1e3a8a;
    }
    input, textarea, button {
      font-size: 16px;
      padding: 8px;
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
    }
    textarea { resize: vertical; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover { background-color: #1d4ed8; }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .group-checks {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
    }
    .group-checks legend {
      font-weight: bold;
      color: #374151;
      margin-bottom: 6px;
    }
    .group-checks.two-columns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 12px;
    }
    @media (max-width: 480px) {
      .group-checks.two-columns {
        grid-template-columns: 1fr;
      }
    }
    .group-checks.two-columns label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    .date-row {
      display: flex;
      gap: 10px;
    }
    .secondary-buttons {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: -10px;
      margin-bottom: 10px;
    }
    @media (max-width: 480px) {
      .date-row, .button-row, .secondary-buttons {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h2>📎 Cesium Yield URL Generator</h2>

  <label for="uutTypes">UUT Types (separados por coma):</label>
  <input type="text" id="uutTypes" placeholder="800-110045-01,800-110945-01"/>

  <fieldset class="group-checks two-columns">
    <legend>Business Unit</legend>
    <label><input type="checkbox" onclick="toggleGroup('CVEBU')"> CVEBU</label>
    <label><input type="checkbox" onclick="toggleGroup('IOTBU')"> IOTBU</label>
    <label><input type="checkbox" onclick="toggleGroup('CRBU')"> CRBU</label>
    <label><input type="checkbox" onclick="toggleGroup('TPK')"> TPK</label>
    <label><input type="checkbox" onclick="toggleGroup('WA')"> WA</label>
    <label><input type="checkbox" onclick="toggleGroup('NM')"> NM</label>
    <label><input type="checkbox" onclick="toggleGroup('Oval')"> Oval</label>
    <label><input type="checkbox" onclick="toggleGroup('CVEBU')"> CVEBU 73</label>
    <label><input type="checkbox" onclick="toggleGroup('CVEBU')"> IOTBU 73/label>
  </fieldset>

  <label for="location">Location:</label>
  <input type="text" id="location" value="FJZ"/>

  <!-- 🔹 Nuevo campo Área -->
  <label for="area">Área:</label>
  <input type="text" id="area" placeholder="Ej. PCB%" value="Pcb%"/>

  <div class="date-row">
    <div style="flex:1;">
      <label for="fromDate">From Date:</label>
      <input type="date" id="fromDate"/>
    </div>
    <div style="flex:1;">
      <label for="toDate">To Date:</label>
      <input type="date" id="toDate"/>
    </div>
  </div>

  <div class="secondary-buttons">
    <button onclick="setThisWeek()">📅 Semana</button>
  </div>

  <div class="button-row">
    <button onclick="generateURL()">🎯 Generar URL</button>
    <button onclick="openURL()">🌐 Abrir</button>
  </div>

  <label for="resultURL">Resultado:</label>
  <textarea id="resultURL" rows="3" readonly></textarea>

  <script>
    const groups = {
      CVEBU: ["800-108480-%", "800-109399-%", "800-110045-%", "800-110945-%", "800-112271-%", "800-137504-%", "800-109531-%", "800-109533-%", "800-147504-%", "73-103450-%","73-102121-%",
 "73-103459-%"],
      CRBU: ["88-LC0-36FH", "88-LC0-36FH-M", "8804-FC1", "8808-FC1", "8808-FC0"],
      IOTBU: ["ESS-3300-NCP-E", "ESS-3300-16T-NCP", "ESS-9300-10X-E"],
      TPK: ["800-108035-%", "800-108036-%", "800-108037-%", "800-108038-%", "800-110666-%"],
      WA: ["800-109498-%", "800-109499-%", "800-109500-%"],
      NM: ["73-101944-%", "73-103122-01", "73-102888-01", "73-101945-03", "73-102482-02", "73-102418-04", "73-103125-02"],
      Oval: ["73-102483-%"],
      CVEBU 73: ["73-102885-%","73-102226-%", "73-103226-%", "73-102701-%", "73-102121-%", "73-103360-%", "73-104022-%", "73-101504-%","73-102197-%"],
      IOTBU 73: ["73-101441-%","73-101439-%", "73-102239-%"],
      };

    function toggleGroup(groupName) {
      const input = document.getElementById("uutTypes");
      const current = input.value.split(",").map(e => e.trim()).filter(e => e);
      const groupItems = groups[groupName] || [];
      const hasGroup = groupItems.every(g => current.includes(g));
      let updated;
      if (hasGroup) {
        updated = current.filter(item => !groupItems.includes(item));
      } else {
        updated = [...new Set(current.concat(groupItems))];
      }
      input.value = updated.join(",");
    }

    function setThisWeek() {
      const today = new Date();
      const lastSunday = new Date(today);
      lastSunday.setDate(today.getDate() - today.getDay());
      document.getElementById("fromDate").value = lastSunday.toISOString().split("T")[0];
      document.getElementById("toDate").value = today.toISOString().split("T")[0];
    }

    function generateURL() {
      const uut = document.getElementById("uutTypes").value.trim();
      const location = document.getElementById("location").value.trim();
      const area = document.getElementById("area").value.trim() || "Pcb%";
      const from = document.getElementById("fromDate").value;
      const to = document.getElementById("toDate").value;
      if (!uut || !from || !to) {
        alert("⚠️ Por favor completa todos los campos.");
        return;
      }
      const encodedUUT = encodeURIComponent(uut);
      const encodedLoc = encodeURIComponent(location);
      const encodedArea = encodeURIComponent(area);

      const url = `https://cesium.cisco.com/apps/PolarisSearch/AdvanceYield?SI=${encodedUUT},${encodedArea},${encodedLoc}&SD=${from}&ED=${to}&datetype=nodate&yieldtype=firstpass&yielddatetype=rectime&uuttype=${encodedUUT}&area=${encodedArea}&location=${encodedLoc}&timezone=US%2FMountain`;
      document.getElementById("resultURL").value = url;
    }

    function copyURL() {
      const urlBox = document.getElementById("resultURL");
      urlBox.select();
      document.execCommand("copy");
      alert("📋 URL copiada al portapapeles.");
    }

    function openURL() {
      const url = document.getElementById("resultURL").value;
      if (url) {
        window.open(url, "_blank");
      } else {
        alert("⚠️ Genera una URL primero.");
      }
    }

    window.onload = () => {
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      document.getElementById("fromDate").value = yesterday.toISOString().split("T")[0];
      document.getElementById("toDate").value = today.toISOString().split("T")[0];
    };
  </script>

</body>
</html>
