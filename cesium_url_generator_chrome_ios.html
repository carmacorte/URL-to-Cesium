<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Cesium Yield URL Generator</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fbfe;
      padding: 20px;
      color: #1f2937;
    }
    h2 {
      font-size: 1.4em;
      margin-bottom: 10px;
      color: #1e3a8a;
    }
    input, textarea, button {
      font-size: 16px;
      padding: 8px;
      width: 100%;
      margin-top: 5px;
      margin-bottom: 15px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      box-sizing: border-box;
    }
    textarea { resize: vertical; }
    button {
      background-color: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s ease;
    }
    button:hover { background-color: #1d4ed8; }
    .button-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .group-checks {
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 15px;
    }
    .group-checks legend {
      font-weight: bold;
      color: #374151;
      margin-bottom: 6px;
    }
    .group-checks.two-columns {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px 12px;
    }
    @media (max-width: 480px) {
      .group-checks.two-columns {
        grid-template-columns: 1fr;
      }
    }
    .group-checks.two-columns label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 15px;
    }
    .date-row {
      display: flex;
      gap: 10px;
    }
    @media (max-width: 480px) {
      .date-row, .button-row {
        flex-direction: column;
      }
    }
  </style>
</head>
<body>

  <h2>📎 Cesium Yield URL Generator</h2>

  <label for="uutTypes">UUT Types (separados por coma):</label>
  <input type="text" id="uutTypes" placeholder="800-110045-01,800-110945-01"/>

  <fieldset class="group-checks two-columns">
    <legend>Business Unit</legend>
    <label><input type="checkbox" onclick="toggleGroup('CVEBU')"> CVEBU</label>
    <label><input type="checkbox" onclick="toggleGroup('IOTBU')"> IOTBU</label>
    <label><input type="checkbox" onclick="toggleGroup('CRBU')"> CRBU</label>
    <label><input type="checkbox" onclick="toggleGroup('TPK')"> TPK</label>
    <label><input type="checkbox" onclick="toggleGroup('TPKDF')"> TPKDF</label>
    <label><input type="checkbox" onclick="toggleGroup('WA')"> WA</label>
    <label><input type="checkbox" onclick="toggleGroup('NM')"> NM</label>
    <label><input type="checkbox" onclick="toggleGroup('Oval')"> Oval</label>
    <label><input type="checkbox" onclick="toggleGroup('FIELDWORKS')"> Fieldworks</label>
    <label><input type="checkbox" onclick="toggleGroup('SRGBU')"> SRGBU </label>
    <label><input type="checkbox" onclick="toggleGroup('FRANKLIN')"> FRANKLIN </label>
    <label><input type="checkbox" onclick="toggleGroup('LONGBALL')"> LONGBALL </label>
    <label><input type="checkbox" onclick="toggleGroup('CVEBU_73')"> CVEBU 73</label>
    <label><input type="checkbox" onclick="toggleGroup('IOTBU_73')"> IOTBU 73</label>
  </fieldset>

  <label for="location">Location:</label>
  <input type="text" id="location" value="FJZ"/>

  <label for="area">Área:</label>
  <input type="text" id="area" placeholder="Ej. PCB%" value="Pcb%"/>

  <!-- NUEVO: SELECTOR AUTOMÁTICO DE ÁREA -->
  <div class="button-row" style="margin-top:-10px; margin-bottom:5px;">
    <button type="button" onclick="setArea('Pcb%')">PCB%</button>
    <button type="button" onclick="setArea('Sys%')">SYS%</button>
    <button type="button" onclick="setArea('')">Vacío</button>
  </div>

  <div class="date-row">
    <div style="flex:1;">
      <label for="fromDate">From Date:</label>
      <input type="date" id="fromDate"/>
    </div>
    <div style="flex:1;">
      <label for="toDate">To Date:</label>
      <input type="date" id="toDate"/>
    </div>
  </div>

  <div class="button-row">
    <button onclick="setThisWeek()">📅 Semana</button>
    <button onclick="generateURL()">🎯 Generar URL</button>
    <button onclick="openURL()">🌐 Abrir</button>
  </div>

  <label for="resultURL">Resultado:</label>
  <textarea id="resultURL" rows="3" readonly></textarea>

  <script>
    const groups = {
      CVEBU: ["800-108480-%", "800-109399-%", "800-110045-%", "800-110945-%", "800-112271-%", "800-137504-%", "800-109531-%", "800-109533-%", "800-147504-%", "73-103450-%", "73-102121-%", "73-103459-%"],
      CRBU: ["88-LC0-36FH", "88-LC0-36FH-M", "8804-FC1", "8808-FC1", "8808-FC0"],
      IOTBU: ["ESS-3300-NCP-E", "ESS-3300-16T-NCP", "ESS-9300-10X-E", "ESS-9300-8X16T-W-A"],
      TPK: ["800-108035-%", "800-108036-%", "800-108037-%", "800-108038-%", "800-110666-%"],
      TPKDF: ["FPR3140-ASA-K9","FPR3140-K9=","FPR3140-NGFW-K9"],
      WA: ["800-109498-%", "800-109499-%", "800-109500-%"],
      NM: ["73-101944-%", "73-103122-01", "73-102888-01", "73-101945-03", "73-102482-02", "73-102418-04", "73-103125-02"],
      Oval: ["73-102483-%"],
      FIELDWORKS: ["800-104476-%", "800-104788-%", "800-104789-03-%", "800-106632-03"],
      SRGBU: ["ASR1006-%","ASR1009-%","C8500-%","C9800-%","EDU-C9800%","C8500L-%","ASR1002%","ASR1001%","ISR44%","C888%","ISR1%","C11%","CG1%","NIM-LTEA%","C8550-G2","C8570-G2","C8231-G2","C8151-G2"],
      LONGBALL: ["C9200CX%"],
      FRANKLIN: ["C9300L%","STACK%"],
      CVEBU_73: ["73-102885-%","73-102226-%","73-103226-%","73-102701-%","73-102121-%","73-103360-%","73-104022-%","73-101504-%","73-102197-%"],
      IOTBU_73: ["73-101441-%","73-101439-%","73-102239-%","73-103098-%"]
    };

    function toggleGroup(groupName) {
      const input = document.getElementById("uutTypes");
      const current = input.value.split(",").map(e => e.trim()).filter(e => e);

      const groupItems = groups[groupName] || [];

      const normalized = current.map(i => i.replace(/%/g, "").trim());
      const normalizedGroup = groupItems.map(i => i.replace(/%/g, "").trim());

      const hasGroup = normalizedGroup.every(g =>
        normalized.some(item => item.startsWith(g))
      );

      let updated;

      if (hasGroup) {
        updated = current.filter(item => {
          const clean = item.replace(/%/g, "").trim();
          return !normalizedGroup.some(g => clean.startsWith(g));
        });
      } else {
        updated = [...new Set(current.concat(groupItems))];
      }

      input.value = updated.join(",");
    }

    function setArea(value) {
      document.getElementById("area").value = value;
    }

    function setThisWeek() {
      const today = new Date();
      const lastSunday = new Date(today);
      lastSunday.setDate(today.getDate() - today.getDay());
      document.getElementById("fromDate").value = lastSunday.toISOString().split("T")[0];
      document.getElementById("toDate").value = today.toISOString().split("T")[0];
    }

    function generateURL() {
      const uut = document.getElementById("uutTypes").value.trim();
      const location = document.getElementById("location").value.trim();
      const area = document.getElementById("area").value.trim();
      const from = document.getElementById("fromDate").value;
      const to = document.getElementById("toDate").value;

      if (!uut || !from || !to) {
        alert("⚠️ Por favor completa todos los campos.");
        return;
      }

      const encodedUUT = encodeURIComponent(uut);
      const encodedLoc = encodeURIComponent(location);
      const encodedArea = encodeURIComponent(area);

      const url =
        `https://cesium.cisco.com/apps/PolarisSearch/AdvanceYield?SI=${encodedUUT},${encodedArea},${encodedLoc}` +
        `&SD=${from}&ED=${to}&datetype=nodate&yieldtype=firstpass&yielddatetype=rectime` +
        `&uuttype=${encodedUUT}&area=${encodedArea}&location=${encodedLoc}&timezone=US%2FMountain`;

      document.getElementById("resultURL").value = url;
    }

    function openURL() {
      const url = document.getElementById("resultURL").value;
      if (url) window.open(url, "_blank");
      else alert("⚠️ Genera una URL primero.");
    }

    window.onload = () => {
      const today = new Date();
      const yesterday = new Date();
      yesterday.setDate(today.getDate() - 1);
      document.getElementById("fromDate").value = yesterday.toISOString().split("T")[0];
      document.getElementById("toDate").value = today.toISOString().split("T")[0];
    };
  </script>

</body>
</html>
